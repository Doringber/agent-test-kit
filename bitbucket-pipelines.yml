# Pango Python package pipeline — aligned with pango-automation-infrastructure /
# cicd_for_python_package (Lambda image, OIDC, CodeArtifact publish).
definitions:
  version: 1.0.0
  steps:
    - step: &validate-package
        name: Validate package
        image: public.ecr.aws/lambda/python:3.11
        oidc: true
        script:
          - bash scripts/ci/install-ci-deps.sh
          - bash scripts/ci/validate-package.sh
        artifacts:
          - dist/**
          - reports/**
          - coverage.xml

    - step: &publish-pypi-package
        name: Publish PyPI package to CodeArtifact
        image: public.ecr.aws/lambda/python:3.11
        oidc: true
        script:
          - bash scripts/ci/install-ci-deps.sh
          - bash scripts/ci/publish-pypi-package.sh
        artifacts:
          - dist/**
          - reports/**
          - coverage.xml

pipelines:
  pull-requests:
    "**":
      - step: *validate-package

  branches:
    master:
      - step: *publish-pypi-package
    main:
      - step: *publish-pypi-package

  tags:
    "v*":
      - step: *publish-pypi-package

  custom:
    publish-codeartifact:
      - step: *publish-pypi-package
