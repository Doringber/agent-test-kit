tools_list:
  memory:
  - name: create_entities
    title: Create Entities
    description: Create multiple new entities in the knowledge graph
    inputSchema:
      $schema: http://json-schema.org/draft-07/schema#
      type: object
      properties:
        entities:
          type: array
          items:
            type: object
            properties:
              name:
                type: string
                description: The name of the entity
              entityType:
                type: string
                description: The type of the entity
              observations:
                type: array
                items:
                  type: string
                description: An array of observation contents associated with the
                  entity
            required:
            - name
            - entityType
            - observations
      required:
      - entities
    annotations:
      readOnlyHint: false
      destructiveHint: false
      idempotentHint: false
      openWorldHint: false
    execution:
      taskSupport: forbidden
    outputSchema:
      $schema: http://json-schema.org/draft-07/schema#
      type: object
      properties:
        entities:
          type: array
          items:
            type: object
            properties:
              name:
                type: string
                description: The name of the entity
              entityType:
                type: string
                description: The type of the entity
              observations:
                type: array
                items:
                  type: string
                description: An array of observation contents associated with the
                  entity
            required:
            - name
            - entityType
            - observations
            additionalProperties: false
      required:
      - entities
      additionalProperties: false
  - name: create_relations
    title: Create Relations
    description: Create multiple new relations between entities in the knowledge graph.
      Relations should be in active voice
    inputSchema:
      $schema: http://json-schema.org/draft-07/schema#
      type: object
      properties:
        relations:
          type: array
          items:
            type: object
            properties:
              from:
                type: string
                description: The name of the entity where the relation starts
              to:
                type: string
                description: The name of the entity where the relation ends
              relationType:
                type: string
                description: The type of the relation
            required:
            - from
            - to
            - relationType
      required:
      - relations
    annotations:
      readOnlyHint: false
      destructiveHint: false
      idempotentHint: false
      openWorldHint: false
    execution:
      taskSupport: forbidden
    outputSchema:
      $schema: http://json-schema.org/draft-07/schema#
      type: object
      properties:
        relations:
          type: array
          items:
            type: object
            properties:
              from:
                type: string
                description: The name of the entity where the relation starts
              to:
                type: string
                description: The name of the entity where the relation ends
              relationType:
                type: string
                description: The type of the relation
            required:
            - from
            - to
            - relationType
            additionalProperties: false
      required:
      - relations
      additionalProperties: false
  - name: add_observations
    title: Add Observations
    description: Add new observations to existing entities in the knowledge graph
    inputSchema:
      $schema: http://json-schema.org/draft-07/schema#
      type: object
      properties:
        observations:
          type: array
          items:
            type: object
            properties:
              entityName:
                type: string
                description: The name of the entity to add the observations to
              contents:
                type: array
                items:
                  type: string
                description: An array of observation contents to add
            required:
            - entityName
            - contents
      required:
      - observations
    annotations:
      readOnlyHint: false
