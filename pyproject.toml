[build-system]
requires = ["setuptools>=68", "wheel", "build", "twine"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-test-kit"
dynamic = ["version"]
description = "Shared pytest framework for testing Pango AI agents"
readme = "README.md"
requires-python = ">=3.11"
license = "LicenseRef-Proprietary"
authors = [{ name = "Pango" }]
keywords = ["pytest", "ai-agents", "mcp", "testing", "pango"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Operating System :: OS Independent",
    "Framework :: Pytest",
]
dependencies = [
    "httpx>=0.27",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "pytest-asyncio>=0.23",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = [
    "build>=1.2",
    "mypy>=1.8",
    "pytest>=8.2",
    "pytest-cov>=5.0",
    "ruff>=0.4",
    "twine>=5.0",
    "types-PyYAML>=6.0",
]

[project.entry-points."pytest11"]
agent_test_kit = "agent_test_kit_pytest_entrypoint"

[tool.setuptools.dynamic]
version = { file = "VERSION" }

[tool.setuptools]
package-dir = { "" = "src" }
py-modules = ["agent_test_kit_pytest_entrypoint"]

[tool.setuptools.packages.find]
where = ["src"]
include = ["agent_test_kit*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
files = ["src"]

[[tool.mypy.overrides]]
module = ["pytest.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = [
    "-v",
    "--tb=short",
]
pythonpath = ["src"]
markers = [
    "agent_unit: Fast unit tests for framework components",
    "agent_contract: Contract tests against agent API schemas",
    "agent_integration: Integration tests with real or sandbox services",
    "agent_e2e: End-to-end agent workflow tests",
    "agent_regression: Regression cases from production failures",
    "agent_security: Security and prompt-injection scenarios",
    "agent_write_action: Tests that perform write actions in target systems",
    "agent_nondeterministic: Tests that may flake due to model variance",
    "agent_multi_mcp: Multi-MCP server workflow tests",
]

[tool.coverage.run]
branch = true
parallel = true

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]
