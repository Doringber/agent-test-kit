name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package and test deps
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run tests with coverage
        run: |
          mkdir -p reports
          pytest --cov=agent_test_kit --cov-fail-under=85 -q \
            -m "not agent_e2e and not agent_write_action" \
            --agent-report-json=reports/ci-results.json \
            --agent-report-html=reports/ci-results.html

      - name: Upload HTML report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: agent-test-report-py${{ matrix.python-version }}
          path: reports/
